  - [nationality, skin_color]
  - [nationality, religion]
  - [nationality, politics]
  - [religion, politics]
  - [skin_color, body_type]
  - [skin_color, orientation]
  - [orientation, politics]
  - [religion, skin_color]
  - [phone, skin_color]
  - [nationality, orientation]
